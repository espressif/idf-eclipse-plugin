# This workflow will build a Java project with Maven and publish nightly builds
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Nightly builds

on:
  schedule:
    - cron: "0 0 * * *"
  # Temporary: run on pull requests so signing can be verified before the next schedule.
  pull_request:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: write

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Set up Maven
      uses: stCarolas/setup-maven@v5
      with:
        maven-version: 3.9.6

    - name: Check build environment
      run: |
        mvn -version
        java -version

    - name: Build with Maven
      run: |
        # Skip the local keystore signer. JARs are signed afterwards with espressif/release-sign.
        mvn -e -X clean install -Djarsigner.skip=true -DskipTests=true

    - name: Stage Espressif JARs for signing
      run: |
        set -euo pipefail
        REPO_DIR="releng/com.espressif.idf.update/target/repository"
        STAGE_DIR="espressif-jars-to-sign"
        rm -rf "$STAGE_DIR"
        mkdir -p "$STAGE_DIR"
        : > espressif-jars-sources.list
        # release-sign signs every JAR under path. Stage only com.espressif update-site JARs.
        while IFS= read -r -d '' file; do
          if [[ "$file" =~ (plugins|features)/com\.espressif\. ]]; then
            rel="${file#"$REPO_DIR"/}"
            staged="${rel//\//__}"
            cp "$file" "$STAGE_DIR/$staged"
            printf '%s\t%s\n' "$staged" "$file" >> espressif-jars-sources.list
            echo "Staged: $file"
          fi
        done < <(find "$REPO_DIR" -type f -name "*.jar" -print0)
        if [ ! -s espressif-jars-sources.list ]; then
          echo "No Espressif JARs found to sign"
          exit 1
        fi

    - name: Sign Espressif JARs
      uses: espressif/release-sign@master
      with:
        path: espressif-jars-to-sign
        azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
        azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
        azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
        azure-keyvault-uri: ${{ secrets.AZURE_KEYVAULT_URI }}
        azure-keyvault-cert-name: ${{ secrets.AZURE_KEYVAULT_CERT_NAME }}
        azure-keyvault-certchain: ${{ secrets.AZURE_KEYVAULT_CERTCHAIN }}

    - name: Restore signed JARs
      run: |
        set -euo pipefail
        while IFS=$'\t' read -r staged orig; do
          [ -z "${staged:-}" ] && continue
          cp "espressif-jars-to-sign/$staged" "$orig"
          echo "Restored: $orig"
        done < espressif-jars-sources.list

    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'

    - name: Regenerate P2 Metadata
      run: |
        # Signing changes file checksums, so we must fix the P2 metadata
        mvn -f releng/com.espressif.idf.update/pom.xml \
          org.eclipse.tycho:tycho-p2-repository-plugin:fix-artifacts-metadata \
          -DrepositoryPath="releng/com.espressif.idf.update/target/repository" \
          -DskipTests=true

    - name: Codesign Espressif-IDE applications
      uses: espressif/release-sign@master
      with:
        path: releng/com.espressif.idf.product/target/products/com.espressif.idf.product/macosx/cocoa
        macos-signing-identity: ${{ secrets.MACOS_CS_IDENTITY_ID }}
        macos-certificate: ${{ secrets.MACOS_CS_CERTIFICATE }}
        macos-certificate-pwd: ${{ secrets.MACOS_CS_CERTIFICATE_PWD }}
        macos-entitlements: releng/com.espressif.idf.product/entitlements/espressif-ide.entitlement

    - name: Create DMG for macOS x86_64
      run: $PWD/releng/ide-dmg-builder/ide-dmg-builder.sh

    - name: Create DMG for macOS aarch64
      run: $PWD/releng/ide-dmg-builder/ide-dmg-builder-aarch64.sh

    - name: Stage macOS DMGs
      run: |
        set -euo pipefail
        mkdir -p macos-dmgs
        mv releng/ide-dmg-builder/Espressif-IDE-macosx-cocoa-x86_64.dmg macos-dmgs/
        mv releng/ide-dmg-builder/Espressif-IDE-macosx-cocoa-aarch64.dmg macos-dmgs/

    - name: Codesign macOS DMGs
      uses: espressif/release-sign@master
      with:
        path: macos-dmgs
        macos-signing-identity: ${{ secrets.MACOS_CS_IDENTITY_ID }}
        macos-certificate: ${{ secrets.MACOS_CS_CERTIFICATE }}
        macos-certificate-pwd: ${{ secrets.MACOS_CS_CERTIFICATE_PWD }}

    - name: Notarize macOS DMGs
      env:
        NOTARIZATION_USERNAME: ${{ secrets.NOTARIZATION_USERNAME }}
        NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
        NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
      run: |
        set -euo pipefail
        # release-sign waits only 600 seconds, which these DMGs exceed while Apple
        # is still reporting "In Progress". Stapling then fails with error 65.
        KEYCHAIN_NAME="notary.keychain"
        KEYCHAIN_PASSWORD="$(openssl rand -hex 32)"
        KEYCHAIN_PATH="${HOME}/Library/Keychains/${KEYCHAIN_NAME}-db"
        cleanup() {
          security delete-keychain "$KEYCHAIN_NAME" >/dev/null 2>&1 || true
        }
        trap cleanup EXIT
        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_NAME"
        security set-keychain-settings -lut 21600 "$KEYCHAIN_NAME"
        xcrun notarytool store-credentials "ide-notarytool-profile" \
          --apple-id "$NOTARIZATION_USERNAME" \
          --team-id "$NOTARIZATION_TEAM_ID" \
          --password "$NOTARIZATION_PASSWORD" \
          --keychain "$KEYCHAIN_PATH"
        unset NOTARIZATION_PASSWORD KEYCHAIN_PASSWORD
        notarize() {
          local item="$1"
          local output status submission_id
          echo "Notarizing ${item}"
          set +e
          output="$(xcrun notarytool submit "$item" \
            --keychain-profile "ide-notarytool-profile" \
            --keychain "$KEYCHAIN_PATH" \
            --wait --timeout 60m 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            submission_id="$(printf '%s\n' "$output" | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -n 1 || true)"
            if [ -n "$submission_id" ]; then
              echo "Apple rejection log for ${submission_id}:" >&2
              xcrun notarytool log "$submission_id" \
                --keychain-profile "ide-notarytool-profile" \
                --keychain "$KEYCHAIN_PATH" >&2 || true
            fi
            exit "$status"
          fi
          xcrun stapler staple "$item"
          echo "Stapled ${item}"
        }
        notarize macos-dmgs/Espressif-IDE-macosx-cocoa-x86_64.dmg
        notarize macos-dmgs/Espressif-IDE-macosx-cocoa-aarch64.dmg

    - name: Restore signed DMGs
      run: |
        set -euo pipefail
        mv macos-dmgs/Espressif-IDE-macosx-cocoa-x86_64.dmg releng/ide-dmg-builder/
        mv macos-dmgs/Espressif-IDE-macosx-cocoa-aarch64.dmg releng/ide-dmg-builder/

    - name: Upload Espressif-IDE-macosx-cocoa-x86_64.dmg
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: espressif-ide-macosx-cocoa-x86_64
        path: releng/ide-dmg-builder/Espressif-IDE-macosx-cocoa-x86_64.dmg

    - name: Upload Espressif-IDE-macosx-cocoa-aarch64.dmg
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: espressif-ide-macosx.cocoa.aarch64
        path: releng/ide-dmg-builder/Espressif-IDE-macosx-cocoa-aarch64.dmg

    - name: Upload build artifacts
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: com.espressif.idf.update
        path: releng/com.espressif.idf.update/target/repository
        
    - name: Upload windows rcp
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: espressif-ide-win32
        path: releng/com.espressif.idf.product/target/products/Espressif-IDE-*-win32.win32.x86_64.zip

    - name: Upload linux rcp
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@v7
      with:
        name: espressif-ide-linux
        path: releng/com.espressif.idf.product/target/products/Espressif-IDE-*-linux.gtk.x86_64.tar.gz

    - name: Upload build assets to dl.espressif.com
      if: ${{ github.event_name == 'schedule' }}
      id: upload-release-asset-espressif
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION }}
      run: |
        set -euo pipefail
        REPO_DIR="releng/com.espressif.idf.update/target/repository"
        ARCHIVE_DIR="/releng/com.espressif.idf.update/target/"
        ARCHIVE_NAME="com.espressif.idf.update*.zip"
        ARCHIVE_FILE_NAME="$(find ${PWD}${ARCHIVE_DIR}${ARCHIVE_NAME})"
        echo "${ARCHIVE_FILE_NAME}"
        ARCHIVE_PREFIX="com.espressif.idf.update-"
        ARCHIVE_SUFFIX="-SNAPSHOT.zip";
        tmp=${ARCHIVE_FILE_NAME#*${ARCHIVE_PREFIX}}   # remove prefix
        ARCHIVE_VERSION=${tmp%${ARCHIVE_SUFFIX}*}   # remove suffix
        echo "${ARCHIVE_VERSION}"
        FOLDER_NAME="v${ARCHIVE_VERSION}"
        # The Maven zip is created before JAR signing. Publish the repository
        # directory, which holds the signed JARs and the repaired p2 metadata.
        test -d "${REPO_DIR}"
        mv releng/ide-dmg-builder/Espressif-IDE-macosx-cocoa-x86_64.dmg "releng/ide-dmg-builder/Espressif-IDE-macosx-cocoa-x86_64-${FOLDER_NAME}.dmg"
        mv releng/ide-dmg-builder/Espressif-IDE-macosx-cocoa-aarch64.dmg "releng/ide-dmg-builder/Espressif-IDE-macosx-cocoa-aarch64-${FOLDER_NAME}.dmg"
        aws s3 rm s3://${{ secrets.DL_BUCKET }}/dl/idf-eclipse-plugin/updates/nightly --recursive
        aws s3 cp --acl=public-read --recursive "${REPO_DIR}/" s3://${{ secrets.DL_BUCKET }}/dl/idf-eclipse-plugin/updates/nightly
        aws s3 cp --acl=public-read "./releng/index.html" s3://${{ secrets.DL_BUCKET }}/dl/idf-eclipse-plugin/updates/nightly/
        aws cloudfront create-invalidation --distribution-id ${{ secrets.DL_DISTRIBUTION_ID }} --paths "/dl/idf-eclipse-plugin/updates/nightly/*"
